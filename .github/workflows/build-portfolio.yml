name: Build Portfolio Projects

on:
  # Tous les jours à minuit UTC
  schedule:
    - cron: "0 0 * * *"
  # Déclenchement manuel depuis GitHub Actions
  workflow_dispatch:

permissions:
  contents: write # Donne à GITHUB_TOKEN le droit d'écrire/pusher sur ce repo

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Scan repos & generate projects.json

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          # On utilise GITHUB_TOKEN ici pour avoir les droits d'écriture garantis sur ce repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run build script
        env:
          # On passe PORTFOLIO_GITHUB_TOKEN au script pour lire les repos privés
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/build-projects.js

      - name: Stage generated catalogue and media
        run: git add -A -- assets/data/projects.json assets/images/Projects/

      - name: Install and validate generated portfolio
        run: npm ci && npm run check

      - name: Commit & Push changes
        id: git_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in projects data."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected, committing and pushing..."
            git commit -m "chore: update portfolio projects data"
            git push origin main
          fi

      # Déclenchement direct du webhook Coolify (si configuré dans les secrets GitHub)
      - name: Trigger Coolify Deploy Webhook
        if: steps.git_push.outputs.changed == 'true' && env.COOLIFY_WEBHOOK_URL != ''
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          echo "Pinging Coolify Deploy Webhook..."
          curl --fail --silent --show-error --max-time 60 -X GET "$COOLIFY_WEBHOOK_URL"
          echo "Coolify webhook triggered successfully!"
