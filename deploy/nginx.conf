server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ =404; }
    # Les données et médias changent à URL constante lors des synchronisations.
    location /assets/data/ { add_header Cache-Control "no-cache"; }
    location /assets/images/ { add_header Cache-Control "public, max-age=3600, must-revalidate"; }
    location ~* \.(html|pdf)$ { add_header Cache-Control "no-cache"; }
}
